<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171513"><title>LR Peluquería</title>
<style>
:root{--bg:#171513;--panel:#24211e;--gold:#d7b98c;--cream:#f8f3ec;--muted:#b8aa98}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100dvh;padding-bottom:78px;background:#171513}.top{padding:18px 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #39322a;position:sticky;top:0;background:#171513;z-index:4}.logo{border:1px solid var(--gold);border-radius:50%;width:43px;height:43px;display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif;font-size:22px}.brand{letter-spacing:2px;font-family:Georgia,serif}.sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:3px}.content{padding:16px}.hero{border-radius:18px;min-height:270px;padding:22px;display:flex;flex-direction:column;justify-content:end;background:linear-gradient(0deg,#100e0cf5,transparent 75%),url('https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=900&q=85') center/cover;margin-bottom:16px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:2px}.hero h1{font:36px/1.05 Georgia,serif;margin:8px 0}.hero p{color:#e6ded4;margin:0 0 18px}.btn{border:0;border-radius:12px;background:var(--gold);color:#1b1712;padding:13px 15px;font-weight:700;width:100%;margin:5px 0}.btn.outline{background:transparent;color:var(--gold);border:1px solid var(--gold)}.section-title{font:25px Georgia,serif;margin:20px 0 12px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile,.card{background:var(--panel);border:1px solid #39332c;border-radius:14px;padding:14px}.tile b{display:block;margin:7px 0}.tile span{color:var(--muted);font-size:12px}.icon{font-size:23px;color:var(--gold)}.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #39332c}.thumb{width:74px;height:74px;flex-shrink:0;border-radius:10px;object-fit:cover;background:#40372d}.iteminfo{flex:1}.iteminfo b{display:block}.price{color:var(--gold);font-weight:700;margin-top:5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:#100f0e;border-top:1px solid #39332c;padding:8px 3px max(8px,env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:#b8aa98;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px}.nav button span{font-size:19px}.nav button.active{color:var(--gold)}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}input,select{width:100%;background:#100f0e;color:#fff;border:1px solid #514537;border-radius:10px;padding:12px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid #554838;background:#211e1a;color:#eee1d1;border-radius:20px;padding:8px 12px}.pill.selected{background:var(--gold);color:#171513}.notice{padding:12px;background:#30291f;border-radius:10px;color:#ead3ad;font-size:13px;margin:10px 0}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo-grid img{width:100%;height:150px;object-fit:cover;border-radius:12px}.back{background:none;color:var(--gold);border:0;padding:0 0 12px}.small{font-size:12px}.empty{padding:25px;text-align:center;color:var(--muted)}a{color:var(--gold)}
</style></head>
<body><div class="app"><header class="top"><div class="logo">LR</div><div><div class="brand">LR PELUQUERÍA</div><div class="sub">SALÓN · COLOR · ACADEMIA</div></div></header><main id="screen" class="content"></main><nav class="nav" id="nav"></nav></div>
<script>
const services=[["Balayage","Desde $45.000","3 hs","photo-1522337360788-8b13dee7a37e"],["Coloración global","Desde $35.000","2 hs","photo-1560865218-2c6b6b2a3c1f"],["Corte de puntas","Desde $18.000","1 h","photo-1562322140-8baeececf3df"],["Brushing","Desde $15.000","1 h","photo-1487412720507-e7ab37603c6f"],["Tratamiento capilar","Desde $20.000","1 h 30 min","photo-1527799820374-dcf8d9d4a388"]];
const courses=[["Colorimetría desde cero","$120.000","Principiante","Aprendé teoría del color, cartas de color, neutralización y aplicación práctica."],["Balayage y mechas","$150.000","Intermedio","Técnicas de iluminación, secciones, elección de tonos y acabado."],["Corrección de color","$180.000","Avanzado","Diagnóstico, fondos de aclaración y resolución de trabajos complejos."],["Neutralización de tonos","$120.000","Intermedio","Cómo identificar reflejos y lograr tonos equilibrados."]];
let page="home",selectedService=services[0][0],selectedDate="",selectedTime="",courseChosen=courses[0][0];
const $=s=>document.querySelector(s), img=(id,w=400)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=80`;
function nav(){let items=[["home","⌂","Inicio"],["services","✂","Servicios"],["courses","▤","Cursos"],["gallery","▧","Galería"],["more","☰","Más"]];$("#nav").innerHTML=items.map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${t}</button>`).join("")}
function go(p){page=p;render();window.scrollTo(0,0)}
function item(s){return `<div class="item"><img class="thumb" src="${img(s[3])}" onerror="this.style.display='none'"><div class="iteminfo"><b>${s[0]}</b><div class="muted">Duración: ${s[2]}</div><div class="price">${s[1]}</div></div><button class="pill" onclick="startBooking('${s[0]}')">Elegir</button></div>`}
function startBooking(s){selectedService=s;go('booking')}
function render(){nav();let h="";
if(page==="home")h=`<section class="hero"><div class="eyebrow">SALÓN · COLOR · ACADEMIA</div><h1>Tu belleza,<br>nuestro arte.</h1><p>Descubrí tu próximo look, reservá tu momento y aprendé el arte del color con LR.</p><button class="btn" onclick="go('services')">▦ &nbsp; Reservar mi turno</button><button class="btn outline" onclick="go('courses')">♧ &nbsp; Academia LR Color</button></section><div class="grid"><div class="tile"><div class="icon">✧</div><b>Nuestros servicios</b><span>Cuidamos cada detalle.</span></div><div class="tile"><div class="icon">◉</div><b>Expertas en color</b><span>Técnica y creatividad.</span></div></div><h2 class="section-title">Servicios destacados</h2>${services.slice(0,3).map(item).join("")}<button class="btn outline" onclick="go('gallery')">Ver trabajos de LR</button>`;
if(page==="services")h=`<h1 class="section-title">Nuestros servicios</h1><p class="muted">Elegí tu servicio y comenzá tu reserva.</p>${services.map(item).join("")}`;
if(page==="booking")h=`<button class="back" onclick="go('services')">← Volver a servicios</button><h1 class="section-title">Reservar turno</h1><div class="notice">Paso 1 de 2 · Elegí el servicio, la fecha y el horario que preferís.</div><label>Servicio</label><select id="serv">${services.map(s=>`<option ${s[0]===selectedService?'selected':''}>${s[0]}</option>`).join("")}</select><label>Profesional</label><select id="pro"><option>Laura · Especialista en color</option><option>Martina · Cortes y peinados</option><option>Sofi · Balayage y rubios</option></select><label>Fecha preferida</label><input id="date" type="date" min="${new Date().toISOString().slice(0,10)}" value="${selectedDate}"><label>Horario</label><div class="pills">${["09:00","10:30","12:00","14:00","15:30","17:00","18:30"].map(t=>`<button class="pill ${selectedTime===t?'selected':''}" onclick="selectedTime='${t}';render()">${t}</button>`).join("")}</div><label>Nombre y apellido</label><input id="name" placeholder="Tu nombre"><label>WhatsApp</label><input id="phone" type="tel" placeholder="+54 9 ..."><button class="btn" onclick="confirmBooking()">Solicitar turno</button><p class="muted small">Demo: la reserva queda guardada en este dispositivo; el horario no se bloquea en un servidor.</p>`;
if(page==="courses")h=`<h1 class="section-title">Academia LR Color</h1><p class="muted">Formate con técnicas profesionales y llevá tu pasión por el color al próximo nivel.</p>${courses.map(c=>`<div class="card" style="margin:12px 0"><div class="eyebrow">${c[2]}</div><h3>${c[0]}</h3><p class="muted">${c[3]}</p><div class="price">${c[1]}</div><button class="btn" onclick="courseChosen='${c[0]}';go('enroll')">Ver curso / Inscribirme</button></div>`).join("")}`;
if(page==="enroll")h=`<button class="back" onclick="go('courses')">← Cursos</button><h1 class="section-title">Inscripción al curso</h1><div class="card"><div class="eyebrow">ACADEMIA LR COLOR</div><h2>${courseChosen}</h2><p class="muted">${(courses.find(c=>c[0]===courseChosen)||courses[0])[3]}</p></div><label>Nombre completo</label><input id="student" placeholder="Tu nombre"><label>Email o WhatsApp</label><input id="contact" placeholder="Cómo te contactamos"><button class="btn" onclick="enroll()">Enviar solicitud de inscripción</button>`;
if(page==="gallery")h=`<h1 class="section-title">Galería de trabajos</h1><p class="muted">Inspirate con colores, texturas y transformaciones.</p><div class="pills">${["Todos","Rubios","Morochas","Cobrizos"].map((t,i)=>`<button class="pill ${i===0?'selected':''}" onclick="this.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')">${t}</button>`).join("")}</div><div class="photo-grid">${["photo-1519699047748-de8e457a634e","photo-1529139574466-a303027c1d8b","photo-1524504388940-b1c1722653e1","photo-1508214751196-bcfd4ca60f91","photo-1524250502761-1ac6f2e30d43","photo-1488426862026-3ee34a7d66df"].map(id=>`<img src="${img(id,500)}" loading="lazy">`).join("")}</div><div class="notice">Las imágenes son ilustrativas. En la versión final se pueden cargar los trabajos reales de LR.</div>`;
if(page==="promos")h=`<h1 class="section-title">Promociones</h1><div class="card"><h3>Combo balayage + nutrición</h3><p class="muted">Un look luminoso con cuidado intensivo.</p><div class="price">$65.000 · Precio demo</div><button class="btn" onclick="startBooking('Balayage')">Consultar promo</button></div><div class="card"><h3>10% OFF en cursos</h3><p class="muted">Consultá por las próximas fechas de Academia LR Color.</p><button class="btn" onclick="go('courses')">Ver cursos</button></div>`;
if(page==="my") {let b=JSON.parse(localStorage.getItem("lrbookings")||"[]");let e=JSON.parse(localStorage.getItem("lrenroll")||"[]");h=`<h1 class="section-title">Mi cuenta</h1><div class="card"><div class="icon">♙</div><h3>¡Bienvenida a LR!</h3><p class="muted">Consultá tus reservas y solicitudes de inscripción guardadas en este dispositivo.</p></div><h2 class="section-title">Mis turnos</h2>${b.length?b.map(x=>`<div class="card" style="margin-bottom:8px"><b>${x.service}</b><p class="muted">${x.date} · ${x.time}</p><p>${x.name}</p><span class="eyebrow">SOLICITUD REGISTRADA</span></div>`).join(""):`<div class="empty">Todavía no tenés turnos.<button class="btn" onclick="go('services')">Reservar un turno</button></div>`}<h2 class="section-title">Mis cursos</h2>${e.length?e.map(x=>`<div class="card">${x.course}<p class="muted">${x.contact}</p></div>`).join(""):"<p class='muted'>Todavía no enviaste solicitudes de cursos.</p>"}`;}
if(page==="contact")h=`<h1 class="section-title">Contacto</h1><div class="card"><div class="eyebrow">LR PELUQUERÍA</div><h2>Te esperamos</h2><p>⌖ &nbsp; Dirección: completar dirección del salón</p><p>◷ &nbsp; Lun a sáb · 9:00 a 19:00 (demo)</p><p>☏ &nbsp; WhatsApp: agregar número real</p><p>◎ &nbsp; Instagram: agregar perfil real</p><button class="btn" onclick="alert('Reemplazá este botón con el WhatsApp real de LR.')">Consultar por WhatsApp</button></div>`;
if(page==="admin")h=`<h1 class="section-title">Panel administrativo</h1><div class="notice">Vista de muestra · no tiene acceso protegido ni sincronización online.</div><div class="grid"><div class="tile"><div class="icon">▦</div><b>Turnos guardados</b><span>${JSON.parse(localStorage.getItem("lrbookings")||"[]").length} solicitudes en este dispositivo</span></div><div class="tile"><div class="icon">♧</div><b>Inscripciones</b><span>${JSON.parse(localStorage.getItem("lrenroll")||"[]").length} solicitudes en este dispositivo</span></div><div class="tile" onclick="go('services')"><div class="icon">✂</div><b>Servicios</b><span>Ver catálogo</span></div><div class="tile" onclick="go('promos')"><div class="icon">✧</div><b>Promociones</b><span>Ver ofertas</span></div></div><button class="btn outline" onclick="if(confirm('¿Borrar las reservas e inscripciones de este dispositivo?')){localStorage.removeItem('lrbookings');localStorage.removeItem('lrenroll');render()}">Limpiar datos de demo</button>`;
if(page==="more")h=`<h1 class="section-title">Más de LR</h1>${[["my","♙","Mi cuenta y mis turnos"],["promos","✧","Promociones"],["contact","⌖","Contacto"],["admin","▦","Panel administrativo (demo)"]].map(([p,i,t])=>`<div class="item" onclick="go('${p}')"><span class="icon">${i}</span><b>${t}</b><span style="margin-left:auto">›</span></div>`).join("")}`;
$("#screen").innerHTML=h;nav()}
function confirmBooking(){let service=$("#serv").value,date=$("#date").value,name=$("#name").value.trim(),phone=$("#phone").value.trim();if(!date||!selectedTime||!name||!phone){alert("Completá fecha, horario, nombre y WhatsApp.");return}let a=JSON.parse(localStorage.getItem("lrbookings")||"[]");a.push({service,date,time:selectedTime,name,phone,professional:$("#pro").value});localStorage.setItem("lrbookings",JSON.stringify(a));alert("¡Solicitud registrada! Esta demo la guardó en este dispositivo.");go("my")}
function enroll(){let student=$("#student").value.trim(),contact=$("#contact").value.trim();if(!student||!contact){alert("Completá tu nombre y un medio de contacto.");return}let a=JSON.parse(localStorage.getItem("lrenroll")||"[]");a.push({course:courseChosen,student,contact});localStorage.setItem("lrenroll",JSON.stringify(a));alert("¡Solicitud de inscripción registrada en la demo!");go("my")}
render();
</script></body></html>
